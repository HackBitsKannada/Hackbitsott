# Minimal Supabase CLI config. Run `supabase init` locally to regenerate a full one if needed.
project_id = "hackbits-ott"

[api]
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 15

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**", "http://localhost:3001/**"]
enable_signup = true

[auth.email]
enable_confirmations = true
